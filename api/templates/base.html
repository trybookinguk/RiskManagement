<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Risk{% endblock %} · RiskManagement</title>
<style>{{ page_css }}</style>
<link rel="icon" type="image/png" href="/static/favicon.png">
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/" aria-label="TryBooking risk dashboard">{% include "_logo.svg" %}</a>
    {% if user %}
    <nav>
      <a href="/" class="{{ 'on' if active == 'risk' }}">Overview</a>
      <a href="/fund-requests" class="{{ 'on' if active == 'funds' }}">Fund requests</a>
      {% if user.role == 'admin' %}<a href="/imports" class="{{ 'on' if active == 'imports' }}">Imports</a>{% endif %}
    </nav>
    <form class="search" action="/search" method="get" role="search">
      <input type="search" name="q" value="{{ q or '' }}" autocomplete="off"
             placeholder="Account or event id or name, booking ID, gateway id, VISA 1234, email, phone">
    </form>
    <div class="who">
      <span>{{ user.who }}{% if user.role == 'admin' %} · admin{% endif %}</span>
      <form action="/logout" method="post"><button class="link" type="submit">Sign out</button></form>
    </div>
    {% endif %}
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
